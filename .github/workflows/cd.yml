name: CD - Continuous Deployment

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_REGISTRY: ghcr.io

jobs:
  build-verify-and-push:
    name: Build, Verify & Publish ChronoX Finance Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute lowercase OCI image name
        id: repo
        run: |
          OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=${DOCKER_REGISTRY}/${OWNER_LOWER}/chronox-finance" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image for container health smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.finance
          load: true
          push: false
          tags: chronox-finance:cd-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Smoke-test container /api/health endpoint
        run: |
          CID=$(docker run -d -p 127.0.0.1:18742:8742 \
            -e CHRONOX_FINANCE_DB_PATH=/data/smoke.sqlite3 \
            chronox-finance:cd-smoke)
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:18742/api/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          HEALTH=$(curl -fsS http://127.0.0.1:18742/api/health)
          echo "Health response: $HEALTH"
          echo "$HEALTH" | grep -q '"status":"ok"'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push verified image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.finance
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: false
