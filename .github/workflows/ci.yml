name: CI - ChronoX Quality, Security & Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-security:
    name: Lint, Security & Frontend Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ruff & PyYAML
        run: python -m pip install --upgrade pip ruff pyyaml
      - name: Run ruff (lint + Bandit security rules)
        run: ruff check chronox_finance config main.py data/ingestion/polygon/client.py data/ingestion/polygon/__init__.py tests
      - name: Verify frontend & Electron JavaScript, shell & YAML syntax
        run: |
          node --check chronox_finance/web/app.js
          find chronox_finance/web/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check desktop/scripts/build-backend.mjs
          find desktop/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          bash -n scripts/install-linux.sh
          bash -n desktop/packaging/arch/PKGBUILD
          python -c "import glob, yaml; [yaml.safe_load(open(p, encoding='utf-8')) for p in glob.glob('.github/workflows/*.yml')]"

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-security
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest with coverage
        run: pytest tests/ -v --cov=chronox_finance --cov=config --cov-report=term-missing

  docker-finance:
    name: Build Finance Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.finance
          push: false
          tags: chronox-finance:ci
