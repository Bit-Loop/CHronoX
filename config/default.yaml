# ChronoX - Default Configuration
# Supports ${ENV_VAR} and ${ENV_VAR:-default} substitution via ConfigManager.

opencode_go:
  api_key: "${OPENCODE_GO_API_KEY}"
  base_url: "${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}"
  model: "${OPENCODE_GO_MODEL:-glm-5.3-flash}"
  protocol: "auto"
  timeout_seconds: 30
  max_daily_requests: 60
  cache_ttl_seconds: 900

finance:
  host: "${CHRONOX_FINANCE_HOST:-127.0.0.1}"
  port: 8742
  db_path: "${CHRONOX_FINANCE_DB_PATH:-.chronox/finance.sqlite3}"
  currency: "${CHRONOX_FINANCE_CURRENCY:-USD}"
  default_cooling_hours: 48
  emergency_buffer_cents: 50000
  hourly_wage_cents: 3000
  require_auth: false

polygon:
  api_key: "${POLYGON_API_KEY}"
  base_url: "https://api.polygon.io"
  rate_limit_calls: 5
  rate_limit_period: 1
  retry_attempts: 3
  retry_backoff_multiplier: 1.0
  retry_backoff_min: 4.0
  retry_backoff_max: 10.0
  timeout: 30

timescale:
  host: "${TIMESCALE_HOST:-localhost}"
  port: 5433
  database: "${TIMESCALE_DB:-chronox}"
  user: "${TIMESCALE_USER:-postgres}"
  password: "${TIMESCALE_PASSWORD}"
  min_connections: 1
  max_connections: 20

training:
  batch_size: 256
  learning_rate: 0.0001
  epochs: 100
  hidden_dim: 512
  num_layers: 8
  num_heads: 8
  dropout: 0.1
  gradient_clip: 1.0
  use_amp: true
  use_gradient_checkpointing: false
  device: "cuda"
  num_workers: 4
  pin_memory: true
  timescales:
    - "1min"
    - "15min"
    - "1hour"
    - "12hour"
    - "daily"
  short_term_sequence_length: 1000
  long_term_sequence_length: 5000
  max_symbols_short_term: 15
  max_symbols_long_term: 10
  max_symbols_inference: 30

backtest:
  initial_capital: 100000.0
  commission_rate: 0.001
  slippage_bps: 5.0
  max_position_size: 0.1
  risk_free_rate: 0.04
  calculate_sharpe: true
  calculate_sortino: true
  calculate_max_drawdown: true
  calculate_calmar: true

trading:
  mode: "paper"
  max_symbols: 10
  position_sizing: "kelly"
  rebalance_frequency: "daily"
  max_portfolio_risk: 0.02
  max_daily_loss: 0.05
  max_positions: 20
  enforce_budget_guardrail: true
  alpaca_api_key: "${ALPACA_API_KEY}"
  alpaca_secret_key: "${ALPACA_SECRET_KEY}"
  alpaca_base_url: "${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}"

monitoring:
  prometheus_port: 9090
  grafana_port: 3000
  mlflow_port: 5000
  enable_email_alerts: false
  enable_slack_alerts: false
  enable_telegram_alerts: false
  alert_email: "${ALERT_EMAIL}"
  slack_webhook: "${SLACK_WEBHOOK}"
  telegram_token: "${TELEGRAM_TOKEN}"
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"
