services:
  # ChronoX ADHD-Friendly Personal Finance & Self-Updating Auto-Budgeting App
  chronox-finance:
    build:
      context: .
      dockerfile: docker/Dockerfile.finance
    container_name: chronox-finance
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHRONOX_FINANCE_PORT:-8742}:8742"
    environment:
      - CHRONOX_FINANCE_HOST=0.0.0.0
      - CHRONOX_FINANCE_PORT=8742
      - CHRONOX_FINANCE_DB_PATH=/data/finance.sqlite3
      - CHRONOX_INTELLIGENCE_MODE=${CHRONOX_INTELLIGENCE_MODE:-hybrid}
      - CHRONOX_AI_PROVIDER=${CHRONOX_AI_PROVIDER:-auto}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY:-}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - OPENCODE_GO_BASE_URL=${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
      - OPENCODE_GO_MODEL=${OPENCODE_GO_MODEL:-glm-5.3-flash}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      - CHRONOX_FINANCE_SECRET_KEY=${CHRONOX_FINANCE_SECRET_KEY:-}
    security_opt:
      - no-new-privileges:true
    volumes:
      - finance-data:/data
    networks:
      - chronox-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8742/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # TimescaleDB - PostgreSQL extension for market time-series data
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: chronox-timescaledb
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./scripts/init_timescale_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - POSTGRES_USER=${TIMESCALE_USER:-postgres}
      - POSTGRES_PASSWORD=${TIMESCALE_PASSWORD:?Set TIMESCALE_PASSWORD in .env}
      - POSTGRES_DB=${TIMESCALE_DB:-chronox}
      - PGDATA=/var/lib/postgresql/data/pgdata
    networks:
      - chronox-net
    profiles:
      - trading
      - full
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-postgres} -d ${TIMESCALE_DB:-chronox}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for real-time market streaming Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: chronox-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - chronox-net
    command: redis-server --appendonly yes
    profiles:
      - trading
      - full

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: chronox-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - chronox-net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    profiles:
      - monitoring

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: chronox-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    networks:
      - chronox-net
    depends_on:
      - prometheus
      - timescaledb
    profiles:
      - monitoring

networks:
  chronox-net:
    driver: bridge

volumes:
  finance-data:
  timescaledb-data:
  redis-data:
  prometheus-data:
  grafana-data:
