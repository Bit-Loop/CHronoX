<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:*;"
  />
  <title>ChronoX Finance — Booting</title>
  <link rel="stylesheet" href="./splash.css" />
</head>
<body>
  <main id="splash-card" class="splash-card" data-stage="starting" role="status" aria-live="polite">
    <header class="splash-meta">
      <span class="vault-badge">
        <svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true">
          <rect x="4" y="11" width="16" height="10" />
          <path d="M8 11V7a4 4 0 0 1 8 0v4" />
        </svg>
        <span>ENCRYPTED VAULT</span>
      </span>
      <span id="splash-version" class="version-pill">DESKTOP</span>
    </header>

    <section class="splash-hero">
      <div class="emblem-wrap" aria-hidden="true">
        <svg class="emblem-svg" viewBox="0 0 88 88" fill="none">
          <rect x="6" y="6" width="76" height="76" class="emblem-track" stroke-width="1.5" />
          <g class="emblem-ticks" stroke-width="1.8" stroke-linecap="square">
            <line x1="44" y1="8" x2="44" y2="14" />
            <line x1="80" y1="44" x2="74" y2="44" />
            <line x1="44" y1="80" x2="44" y2="74" />
            <line x1="8" y1="44" x2="14" y2="44" />
          </g>
          <path
            class="emblem-arc"
            d="M 68.45 38.80 A 25 25 0 1 1 49.20 19.55"
            stroke="#10b981"
            stroke-width="5.5"
            stroke-linecap="butt"
          />
          <rect class="emblem-beacon" x="59" y="23.5" width="6" height="6" />
          <path
            class="emblem-hands"
            d="M 44 30 L 44 44 L 55 51"
            stroke-width="4.2"
            stroke-linecap="square"
            stroke-linejoin="miter"
          />
          <rect class="emblem-pivot-outer" x="40.5" y="40.5" width="7" height="7" />
          <rect class="emblem-pivot-inner" x="42.5" y="42.5" width="3" height="3" />
        </svg>
      </div>

      <div class="brand-copy">
        <h1 class="brand-title">CHRONOX FINANCE</h1>
        <p class="brand-sub">INDUSTRIAL PERSONAL FINANCE COMMAND</p>
      </div>
    </section>

    <section id="boot-panel" class="boot-panel">
      <div class="status-row">
        <div id="status-pill" class="status-pill">
          <span class="status-indicator" aria-hidden="true">
            <span class="status-dot"></span>
            <svg class="status-icon-ready hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square">
              <polyline points="20 6 9 17 4 12" />
            </svg>
          </span>
          <span id="status-label" class="status-label">Starting local vault</span>
        </div>
      </div>

      <p id="status-detail" class="status-detail">Launching local ChronoX engine</p>

      <div
        id="progress-track"
        class="progress-track"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="14"
        aria-label="Startup progress"
      >
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </section>

    <section id="error-panel" class="error-panel hidden" role="alert">
      <div class="error-banner">
        <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
          <line x1="12" y1="9" x2="12" y2="13" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
        <div class="error-copy">
          <p id="error-title" class="error-title">Local engine failed to start</p>
          <p id="error-detail" class="error-detail">Check diagnostics logs or retry startup.</p>
        </div>
      </div>
      <div class="error-actions">
        <button id="btn-retry" type="button" class="btn btn-primary">Retry</button>
        <button id="btn-view-logs" type="button" class="btn btn-ghost">Logs</button>
        <button id="btn-quit" type="button" class="btn btn-subtle">Quit</button>
      </div>
    </section>

    <section id="logs-sheet" class="logs-sheet hidden" aria-label="Backend startup logs">
      <div class="logs-head">
        <div class="logs-head-left">
          <span class="logs-title">Startup Diagnostics</span>
        </div>
        <div class="logs-head-actions">
          <button id="btn-copy-logs" type="button" class="mini-btn">Copy</button>
          <button id="btn-close-logs" type="button" class="mini-btn">Back</button>
        </div>
      </div>
      <div id="logs-list" class="logs-list" tabindex="0"></div>
      <div id="logs-meta" class="logs-meta">Local backend diagnostics</div>
    </section>
  </main>

  <script src="./splash.js"></script>
</body>
</html>
