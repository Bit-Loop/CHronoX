<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:*;"
  />
  <title>ChronoX Quick Capture</title>
  <link rel="stylesheet" href="./quick-capture.css" />
</head>
<body>
  <main id="hud-card" class="hud-card" data-state="capture" role="dialog" aria-label="ChronoX Quick Capture">
    <div class="hud-glow hud-glow-emerald" aria-hidden="true"></div>
    <div class="hud-glow hud-glow-sky" aria-hidden="true"></div>

    <!-- Top Spotlight Header Strip -->
    <header class="hud-header">
      <div class="hud-brand">
        <svg class="hud-logo" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="hudArcGrad" x1="4" y1="24" x2="24" y2="4" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#10b981" />
              <stop offset="55%" stop-color="#2dd4bf" />
              <stop offset="100%" stop-color="#38bdf8" />
            </linearGradient>
          </defs>
          <path
            d="M 23.78 11.92 A 10 10 0 1 1 16.08 4.22"
            stroke="url(#hudArcGrad)"
            stroke-width="2.5"
            stroke-linecap="round"
          />
          <circle cx="21.07" cy="6.93" r="1.7" fill="#38bdf8" />
          <path
            d="M 14 8.6 V 14 L 18.2 16.6"
            stroke="url(#hudArcGrad)"
            stroke-width="2.3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span class="hud-title">Quick Capture</span>
        <span id="live-safe-pill" class="safe-pill hidden" title="Safe to Spend Today">
          <span class="safe-pill-label">Safe today</span>
          <span id="live-safe-value" class="safe-pill-value tabular-nums">$0.00</span>
        </span>
      </div>

      <div class="hud-header-actions">
        <button id="btn-open-app" type="button" class="header-btn" title="Open ChronoX Finance window">
          <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="3" />
            <line x1="3" y1="9" x2="21" y2="9" />
            <polyline points="13 13 17 13 17 17" />
            <line x1="11" y1="17" x2="17" y2="13" />
          </svg>
          <span>Open Full App</span>
        </button>
        <button id="btn-close-hud" type="button" class="icon-close-btn" aria-label="Close Quick Capture (Esc)" title="Close (Esc)">
          <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Active Capture View -->
    <section id="capture-view" class="capture-view">
      <form id="hud-form" class="hud-input-wrap" novalidate>
        <span id="intent-badge" class="intent-badge" data-intent="neutral" aria-hidden="true">
          <svg class="intent-icon intent-icon-neutral" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
          </svg>
          <svg class="intent-icon intent-icon-income hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          <svg class="intent-icon intent-icon-impulse hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="2" x2="12" y2="22" />
            <line x1="4.93" y1="7" x2="19.07" y2="17" />
            <line x1="19.07" y1="7" x2="4.93" y2="17" />
          </svg>
        </span>

        <input
          id="hud-input"
          class="hud-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder='"coffee 6.50", "paycheck +2450", or "impulse 189"'
          aria-label="Quick capture expense, income, or impulse"
          maxlength="500"
        />

        <span id="intent-tag" class="intent-tag hidden"></span>

        <button id="btn-submit" type="submit" class="submit-btn" aria-label="Log entry">
          <span id="btn-submit-label">Log</span>
          <svg class="submit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="9 10 4 15 9 20" />
            <path d="M20 4v7a4 4 0 0 1-4 4H4" />
          </svg>
        </button>
      </form>

      <!-- One-Tap Crisp SVG Chips -->
      <div class="chips-row" role="group" aria-label="One-tap quick entries">
        <span class="chips-label">One-tap</span>

        <button type="button" class="chip" data-quick="coffee 6.50">
          <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 8h1a4 4 0 0 1 0 8h-1" />
            <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z" />
            <line x1="6" y1="2" x2="6" y2="4" />
            <line x1="10" y1="2" x2="10" y2="4" />
            <line x1="14" y1="2" x2="14" y2="4" />
          </svg>
          <span>Coffee $6.50</span>
        </button>

        <button type="button" class="chip" data-quick="groceries 65">
          <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="20" r="1.4" />
            <circle cx="18" cy="20" r="1.4" />
            <path d="M2 3h3l2.4 12.2a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L22 7H6" />
          </svg>
          <span>Groceries $65</span>
        </button>

        <button type="button" class="chip" data-quick="gas 45">
          <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 20V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v15" />
            <line x1="2" y1="20" x2="17" y2="20" />
            <path d="M15 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V9l-3-3" />
            <rect x="7" y="6" width="5" height="4" rx="0.8" />
          </svg>
          <span>Gas $45</span>
        </button>

        <button type="button" class="chip chip-cool" data-quick="impulse ">
          <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="2" x2="12" y2="22" />
            <line x1="4.93" y1="7" x2="19.07" y2="17" />
            <line x1="19.07" y1="7" x2="4.93" y2="17" />
          </svg>
          <span>Park Impulse</span>
        </button>
      </div>

      <!-- Inline Calm Feedback / Error Row (replaces hints when active) -->
      <div id="hud-error" class="hud-error hidden" role="alert">
        <div class="hud-error-left">
          <svg class="ui-icon error-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <span id="hud-error-text" class="hud-error-text"></span>
        </div>
        <button id="btn-unlock-app" type="button" class="unlock-btn hidden">Unlock App</button>
      </div>

      <!-- Quiet Keyboard Footer Hints -->
      <footer id="hud-footer" class="hud-footer">
        <div class="footer-keys">
          <span class="hint-item"><kbd>Enter</kbd> log</span>
          <span class="hint-item"><kbd>Tab</kbd> chips</span>
          <span class="hint-item"><kbd>Esc</kbd> dismiss</span>
        </div>
        <span id="hud-shortcut-hint" class="footer-right tabular-nums">Ctrl+Shift+Space</span>
      </footer>
    </section>

    <!-- Calm Emerald Confirmation State -->
    <section id="confirm-view" class="confirm-view hidden" role="status" aria-live="polite">
      <div class="confirm-body">
        <div class="confirm-check-wrap" aria-hidden="true">
          <svg class="confirm-check-svg" viewBox="0 0 52 52" fill="none">
            <circle class="confirm-ring" cx="26" cy="26" r="22" stroke-width="2.6" />
            <path class="confirm-tick" d="M 16.5 26.8 L 23.0 33.2 L 36.0 19.8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>

        <div class="confirm-copy">
          <p id="confirm-kicker" class="confirm-kicker">Saved to ChronoX</p>
          <p id="confirm-message" class="confirm-message">Logged entry</p>
        </div>

        <div id="confirm-safe-card" class="confirm-safe-card">
          <span class="confirm-safe-label">Safe to Spend Today</span>
          <span id="confirm-safe-amount" class="confirm-safe-amount tabular-nums">$0.00</span>
          <span id="confirm-safe-meta" class="confirm-safe-meta tabular-nums"></span>
        </div>
      </div>

      <div class="confirm-progress-track" aria-hidden="true">
        <div id="confirm-progress-fill" class="confirm-progress-fill"></div>
      </div>
    </section>
  </main>

  <script src="./quick-capture.js"></script>
</body>
</html>
