<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:*;"
  />
  <title>ChronoX Quick Capture</title>
  <link rel="stylesheet" href="./quick-capture.css" />
</head>
<body>
  <main id="hud-card" class="hud-card" data-state="capture" role="dialog" aria-label="ChronoX Quick Capture">
    <header class="hud-header">
      <div class="hud-brand">
        <svg class="hud-logo" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <rect x="2" y="2" width="24" height="24" stroke="#2b3542" stroke-width="1.8" />
          <path d="M 23.78 11.92 A 10 10 0 1 1 16.08 4.22" stroke="#10b981" stroke-width="2.6" />
          <rect x="19.5" y="5.5" width="3" height="3" fill="#06b6d4" />
          <path d="M 14 8.6 V 14 L 18.2 16.6" stroke="#eef2f6" stroke-width="2.2" stroke-linecap="square" />
        </svg>
        <span class="hud-title">QUICK CAPTURE</span>
        <span id="live-safe-pill" class="safe-pill hidden" title="Safe to Spend Today">
          <span class="safe-pill-label">SAFE</span>
          <span id="live-safe-value" class="safe-pill-value tabular-nums">$0.00</span>
        </span>
      </div>

      <div class="hud-header-actions">
        <button id="btn-open-app" type="button" class="header-btn" title="Open ChronoX Finance window">
          <span>OPEN APP</span>
        </button>
        <button id="btn-close-hud" type="button" class="icon-close-btn" aria-label="Close Quick Capture (Esc)" title="Close (Esc)">
          <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="square" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
    </header>

    <section id="capture-view" class="capture-view">
      <form id="hud-form" class="hud-input-wrap" novalidate>
        <span id="intent-badge" class="intent-badge" data-intent="neutral" aria-hidden="true">
          <svg class="intent-icon intent-icon-neutral" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
          </svg>
          <svg class="intent-icon intent-icon-income hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          <svg class="intent-icon intent-icon-impulse hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
            <line x1="12" y1="2" x2="12" y2="22" />
            <line x1="4.93" y1="7" x2="19.07" y2="17" />
            <line x1="19.07" y1="7" x2="4.93" y2="17" />
          </svg>
        </span>

        <input
          id="hud-input"
          class="hud-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder='Say or log anything: "Spent $5.75 on coffee because early flight" or "Can I afford $400?"'
          aria-label="Say or log an expense, transfer, question, or command"
          maxlength="500"
        />

        <span id="intent-tag" class="intent-tag hidden"></span>

        <button id="btn-submit" type="submit" class="submit-btn" aria-label="Send entry">
          <span id="btn-submit-label">Send</span>
        </button>
      </form>

      <div class="chips-row" role="group" aria-label="Quick prompts">
        <span class="chips-label">Prompts</span>
        <button type="button" class="chip" data-quick="I spent $"><span>Log Expense</span></button>
        <button type="button" class="chip" data-quick="Put $ in savings"><span>Save Money</span></button>
        <button type="button" class="chip" data-quick="Can I afford "><span>Ask Coach</span></button>
        <button type="button" class="chip chip-cool" data-quick="impulse "><span>Park Impulse</span></button>
      </div>

      <div id="hud-error" class="hud-error hidden" role="alert">
        <div class="hud-error-left">
          <svg class="ui-icon error-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <span id="hud-error-text" class="hud-error-text"></span>
        </div>
        <button id="btn-unlock-app" type="button" class="unlock-btn hidden">Unlock Vault</button>
      </div>

      <footer id="hud-footer" class="hud-footer">
        <div class="footer-keys">
          <span class="hint-item"><kbd>ENTER</kbd> log</span>
          <span class="hint-item"><kbd>TAB</kbd> chips</span>
          <span class="hint-item"><kbd>ESC</kbd> dismiss</span>
        </div>
        <span id="hud-shortcut-hint" class="footer-right tabular-nums">Ctrl+Shift+Space</span>
      </footer>
    </section>

    <section id="confirm-view" class="confirm-view hidden" role="status" aria-live="polite">
      <div class="confirm-body">
        <div class="confirm-check-wrap" aria-hidden="true">
          <svg class="confirm-check-svg" viewBox="0 0 52 52" fill="none">
            <rect class="confirm-ring" x="6" y="6" width="40" height="40" stroke-width="2.6" />
            <path class="confirm-tick" d="M 16.5 26.8 L 23.0 33.2 L 36.0 19.8" stroke-width="3.2" stroke-linecap="square" />
          </svg>
        </div>

        <div class="confirm-copy">
          <p id="confirm-kicker" class="confirm-kicker">SAVED TO CHRONOX</p>
          <p id="confirm-message" class="confirm-message">Logged entry</p>
        </div>

        <div id="confirm-safe-card" class="confirm-safe-card">
          <span class="confirm-safe-label">SAFE TO SPEND TODAY</span>
          <span id="confirm-safe-amount" class="confirm-safe-amount tabular-nums">$0.00</span>
          <span id="confirm-safe-meta" class="confirm-safe-meta tabular-nums"></span>
        </div>
      </div>

      <div class="confirm-progress-track" aria-hidden="true">
        <div id="confirm-progress-fill" class="confirm-progress-fill"></div>
      </div>
    </section>
  </main>

  <script src="./quick-capture.js"></script>
</body>
</html>
