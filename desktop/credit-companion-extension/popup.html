<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ChronoX Credit Companion</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      padding: 14px;
      width: 340px;
      background: #080b10;
      color: #e6edf3;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .brand {
      font-weight: 700;
      font-size: 14px;
      color: #f0f6fc;
      letter-spacing: 0.01em;
    }
    .pill {
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.14);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .pill.warn {
      background: rgba(245, 158, 11, 0.14);
      color: #f59e0b;
      border-color: rgba(245, 158, 11, 0.35);
    }
    .score-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .score-tile {
      background: #11161f;
      border: 1px solid #222c3a;
      border-radius: 6px;
      padding: 7px 8px;
      text-align: center;
    }
    .score-lbl {
      font-size: 10px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .score-val {
      font-size: 17px;
      font-weight: 700;
      color: #10b981;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .meta-bar {
      background: #11161f;
      border: 1px solid #222c3a;
      border-radius: 6px;
      padding: 7px 9px;
      font-size: 11.5px;
      color: #9ca3af;
      margin-bottom: 10px;
      font-variant-numeric: tabular-nums;
    }
    .btn-primary {
      width: 100%;
      padding: 9px 12px;
      background: #10b981;
      color: #04130d;
      font-weight: 700;
      font-size: 12.5px;
      border: 0;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn-primary:hover { background: #34d399; }
    .btn-primary:disabled { opacity: 0.55; cursor: default; }
    .PortalRow {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }
    .btn-soft {
      padding: 6px 8px;
      background: #141b26;
      color: #cbd5e1;
      border: 1px solid #283445;
      border-radius: 5px;
      font-size: 11.5px;
      cursor: pointer;
      text-align: center;
    }
    .btn-soft:hover { border-color: #10b981; color: #f8fafc; }
    #status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 5px;
      background: #11161f;
      border: 1px solid #222c3a;
      font-size: 11.5px;
      color: #cbd5e1;
      white-space: pre-wrap;
    }
    .hint {
      margin-top: 8px;
      font-size: 10.5px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="head">
    <span class="brand">ChronoX Credit Companion</span>
    <span id="conn-pill" class="pill">Checking...</span>
  </div>

  <div class="score-grid">
    <div class="score-tile">
      <div class="score-lbl">Experian</div>
      <div id="sc-experian" class="score-val">--</div>
    </div>
    <div class="score-tile">
      <div class="score-lbl">TransUnion</div>
      <div id="sc-transunion" class="score-val">--</div>
    </div>
    <div class="score-tile">
      <div class="score-lbl">Equifax</div>
      <div id="sc-equifax" class="score-val">--</div>
    </div>
  </div>

  <div id="ledger-meta" class="meta-bar">Loading local ChronoX credit ledger...</div>

  <button id="btn-capture" class="btn-primary" type="button">
    Capture &amp; Sync Open Tab &rarr; ChronoX
  </button>

  <div class="PortalRow">
    <button id="btn-open-ck" class="btn-soft" type="button">Open Credit Karma</button>
    <button id="btn-open-exp" class="btn-soft" type="button">Open Experian</button>
  </div>

  <div id="status">Sign into Credit Karma or Experian normally in Edge (pass 2FA in tab), then click Capture &amp; Sync.</div>
  <div class="hint">Direct local stdio bridge &middot; Zero passwords or cloud relays</div>

  <script src="popup.js"></script>
</body>
</html>
