[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chronox"
version = "1.0.0"
description = "ChronoX: ADHD-Friendly Self-Updating Auto-Budgeting, OpenCode Go AI Coach & Algorithmic Market Platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "tenacity>=8.2.0",
    "ratelimit>=2.2.1",
]

[project.optional-dependencies]
trading = [
    "psycopg2-binary>=2.9.9",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "redis>=5.0.0",
    "websocket-client>=1.6.0",
    "aiohttp>=3.9.0",
    "tqdm>=4.66.0",
]
ml = [
    "torch>=2.1.0",
    "scikit-learn>=1.3.0",
    "transformers>=4.35.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
chronox = "main:main"
chronox-finance = "chronox_finance.cli:run_cli"

[tool.setuptools.packages.find]
include = ["chronox_finance*", "config*", "utils*", "data*", "models*", "backtesting*", "monitoring*", "pipelines*", "training*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["docs", "templates", "scripts/legacy", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["E501", "S101", "S104", "S105", "S106", "S608"]
